    <!--
      The machine's lettering: a heavy grotesque for the nameplate and the two
      switch caps, a mono for every stencilled label and readout. Both fall
      back to local faces, so the game still reads correctly offline.

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
